<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Body -->
  <path d="M100 20 C60 20, 30 70, 30 130 C30 190, 60 220, 100 220 C140 220, 170 190, 170 130 C170 70, 140 20, 100 20Z" fill="#93C5FD" stroke="#3D4C5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left eye -->
  <ellipse cx="75" cy="110" rx="12" ry="14" fill="#1a1a2e"/>
  <ellipse cx="79" cy="104" rx="4" ry="5" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="125" cy="110" rx="12" ry="14" fill="#1a1a2e"/>
  <ellipse cx="129" cy="104" rx="4" ry="5" fill="white"/>
  <!-- Blush -->
  <ellipse cx="60" cy="130" rx="12" ry="8" fill="#60A5FA" opacity="0.4"/>
  <ellipse cx="140" cy="130" rx="12" ry="8" fill="#60A5FA" opacity="0.4"/>
  <!-- Smile -->
  <path d="M88 140 Q100 155, 112 140" stroke="#3D4C5E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Arms -->
  <ellipse cx="35" cy="155" rx="15" ry="10" fill="#93C5FD" stroke="#3D4C5E" stroke-width="2.5" transform="rotate(-20 35 155)"/>
  <ellipse cx="165" cy="150" rx="15" ry="10" fill="#93C5FD" stroke="#3D4C5E" stroke-width="2.5" transform="rotate(15 165 150)"/>
  <!-- Laptop -->
  <rect x="165" y="138" width="28" height="18" rx="2" fill="#374151" stroke="#3D4C5E" stroke-width="1.5"/>
  <rect x="167" y="140" width="24" height="13" rx="1" fill="#60A5FA" opacity="0.6"/>
  <rect x="162" y="156" width="34" height="3" rx="1.5" fill="#4B5563" stroke="#3D4C5E" stroke-width="1"/>
  <!-- Feet -->
  <ellipse cx="80" cy="225" rx="16" ry="10" fill="#93C5FD" stroke="#3D4C5E" stroke-width="2.5"/>
  <ellipse cx="120" cy="225" rx="16" ry="10" fill="#93C5FD" stroke="#3D4C5E" stroke-width="2.5"/>
  <!-- Glasses -->
  <circle cx="75" cy="108" r="18" fill="none" stroke="#374151" stroke-width="3"/>
  <circle cx="125" cy="108" r="18" fill="none" stroke="#374151" stroke-width="3"/>
  <path d="M93 108 L107 108" stroke="#374151" stroke-width="3"/>
  <path d="M57 105 L45 100" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <path d="M143 105 L155 100" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
