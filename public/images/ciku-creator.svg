<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Body -->
  <path d="M100 20 C60 20, 30 70, 30 130 C30 190, 60 220, 100 220 C140 220, 170 190, 170 130 C170 70, 140 20, 100 20Z" fill="#FDBA74" stroke="#5E4C3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left eye -->
  <ellipse cx="75" cy="110" rx="12" ry="14" fill="#1a1a2e"/>
  <ellipse cx="79" cy="104" rx="4" ry="5" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="125" cy="110" rx="12" ry="14" fill="#1a1a2e"/>
  <ellipse cx="129" cy="104" rx="4" ry="5" fill="white"/>
  <!-- Blush -->
  <ellipse cx="60" cy="130" rx="12" ry="8" fill="#FB923C" opacity="0.4"/>
  <ellipse cx="140" cy="130" rx="12" ry="8" fill="#FB923C" opacity="0.4"/>
  <!-- Smile -->
  <path d="M88 140 Q100 155, 112 140" stroke="#5E4C3D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Arms -->
  <ellipse cx="35" cy="155" rx="15" ry="10" fill="#FDBA74" stroke="#5E4C3D" stroke-width="2.5" transform="rotate(-20 35 155)"/>
  <ellipse cx="165" cy="150" rx="15" ry="10" fill="#FDBA74" stroke="#5E4C3D" stroke-width="2.5" transform="rotate(15 165 150)"/>
  <!-- Camera -->
  <rect x="170" y="130" width="24" height="18" rx="4" fill="#374151" stroke="#5E4C3D" stroke-width="1.5"/>
  <circle cx="182" cy="139" r="6" fill="#1a1a2e" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="182" cy="139" r="3" fill="#60A5FA"/>
  <rect x="175" y="128" width="8" height="4" rx="2" fill="#4B5563"/>
  <!-- Feet -->
  <ellipse cx="80" cy="225" rx="16" ry="10" fill="#FDBA74" stroke="#5E4C3D" stroke-width="2.5"/>
  <ellipse cx="120" cy="225" rx="16" ry="10" fill="#FDBA74" stroke="#5E4C3D" stroke-width="2.5"/>
  <!-- Headphones -->
  <path d="M50 75 Q50 30, 100 25 Q150 30, 150 75" stroke="#374151" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="38" y="68" width="18" height="25" rx="9" fill="#374151" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="144" y="68" width="18" height="25" rx="9" fill="#374151" stroke="#1a1a2e" stroke-width="1.5"/>
</svg>
