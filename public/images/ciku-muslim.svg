<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Body -->
  <path d="M100 20 C60 20, 30 70, 30 130 C30 190, 60 220, 100 220 C140 220, 170 190, 170 130 C170 70, 140 20, 100 20Z" fill="#86EFAC" stroke="#3D5E4C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left eye -->
  <ellipse cx="75" cy="110" rx="12" ry="14" fill="#1a1a2e"/>
  <ellipse cx="79" cy="104" rx="4" ry="5" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="125" cy="110" rx="12" ry="14" fill="#1a1a2e"/>
  <ellipse cx="129" cy="104" rx="4" ry="5" fill="white"/>
  <!-- Blush -->
  <ellipse cx="60" cy="130" rx="12" ry="8" fill="#4ADE80" opacity="0.4"/>
  <ellipse cx="140" cy="130" rx="12" ry="8" fill="#4ADE80" opacity="0.4"/>
  <!-- Smile -->
  <path d="M88 140 Q100 155, 112 140" stroke="#3D5E4C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Arms -->
  <ellipse cx="35" cy="155" rx="15" ry="10" fill="#86EFAC" stroke="#3D5E4C" stroke-width="2.5" transform="rotate(-20 35 155)"/>
  <ellipse cx="165" cy="150" rx="15" ry="10" fill="#86EFAC" stroke="#3D5E4C" stroke-width="2.5" transform="rotate(15 165 150)"/>
  <!-- Tasbih (prayer beads) -->
  <circle cx="178" cy="145" r="5" fill="#8B5CF6" stroke="#3D5E4C" stroke-width="1.5"/>
  <circle cx="185" cy="152" r="5" fill="#8B5CF6" stroke="#3D5E4C" stroke-width="1.5"/>
  <circle cx="188" cy="162" r="5" fill="#8B5CF6" stroke="#3D5E4C" stroke-width="1.5"/>
  <circle cx="185" cy="172" r="5" fill="#8B5CF6" stroke="#3D5E4C" stroke-width="1.5"/>
  <!-- Feet -->
  <ellipse cx="80" cy="225" rx="16" ry="10" fill="#86EFAC" stroke="#3D5E4C" stroke-width="2.5"/>
  <ellipse cx="120" cy="225" rx="16" ry="10" fill="#86EFAC" stroke="#3D5E4C" stroke-width="2.5"/>
  <!-- Peci (Islamic cap) -->
  <ellipse cx="100" cy="30" rx="40" ry="12" fill="white" stroke="#3D5E4C" stroke-width="2.5"/>
  <path d="M60 30 Q60 5, 100 5 Q140 5, 140 30" fill="white" stroke="#3D5E4C" stroke-width="2.5"/>
</svg>
